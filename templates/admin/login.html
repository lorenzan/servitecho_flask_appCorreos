<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login | Tecuns Roofing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  {% include '_csrf.html' %}
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div style="margin-bottom:26px;">
        <span class="brand-mark"></span>
        <strong style="font-family:var(--font-display); font-size:1.2rem;">TECUNS</strong>
        <div class="text-steel" style="font-family:var(--font-mono); font-size:.78rem; margin-top:4px;">Admin panel</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-rust btn-block">Sign in</button>
      </form>
      <p class="text-steel" style="font-size:.8rem; margin-top:20px; margin-bottom:0;"><a href="{{ url_for('public.index') }}" style="color:var(--rust);">← Back to site</a></p>
    </div>
  </div>
</body>
</html>
